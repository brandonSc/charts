{{- include "lunar.githubAuthCheck" . }}
{{- include "lunar.hubLicenceCheck" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar.fullname" . }}-hub
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if .Values.hub.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "lunar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      {{- with .Values.hub.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lunar.labels" . | nindent 8 }}
        app.kubernetes.io/component: hub
        {{- with .Values.hub.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lunar.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      {{- with .Values.hub.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.hub.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.hub.image.repository }}:{{ .Values.hub.image.tag }}"
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          {{- with .Values.hub }}
          env:
            - name: HUB_ROOT_DIR
              value: {{ .rootDir | quote }}
            - name: HUB_DB_NAME
              value: {{ .db.name | quote }}
            - name: HUB_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .db.user.secretName }}
                  key: {{ .db.user.secretKey }}
            - name: HUB_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .db.pass.secretName }}
                  key: {{ .db.pass.secretKey }}
            - name: HUB_DB_HOST
              value: {{ .db.host | quote }}
            - name: HUB_DB_PORT
              value: {{ .db.port | quote }}
            - name: HUB_DB_WAIT_SECS
              value: {{ .db.waitSecs | quote }}
            - name: HUB_DB_CONNECTION_OPTIONS
              value: {{ .db.connectionOptions | quote }}
            - name: HUB_DB_MIGRATIONS_PATH
              value: "/usr/share/migrations"
            - name: HUB_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.hubWebhookSecretName" $ }}
                  key: {{ .github.webhookSecret.secretKey }}
            - name: HUB_GITHUB_SYNC_WINDOW
              value: {{ .github.syncWindow | quote }}
            - name: HUB_GITHUB_BASE_URL
              value: {{ .github.baseUrl | quote }}
            {{- if gt (len .github.apps) 0 }}
            - name: HUB_GITHUB_APPS
              value: {{ include "lunar.githubAppsJSON" $ | quote }}
            {{- else }}
            - name: HUB_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .github.app.privateKey.secretName }}
                  key: {{ .github.app.privateKey.secretKey }}
            - name: HUB_GITHUB_APP_ID
              value: {{ .github.app.id | quote }}
            - name: HUB_GITHUB_APP_INSTALL_ID
              value: {{ .github.app.installId | quote }}
            {{- end }}
            - name: HUB_POLICY_QUEUE_POLL_INTERVAL
              value: {{ .policyQueue.pollInterval | quote }}
            - name: HUB_POLICY_QUEUE_NUM_WORKERS
              value: {{ .policyQueue.numWorkers | quote }}
            - name: HUB_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.hubAuthSecretName" $ }}
                  key: {{ .auth.secretKey }}
            - name: HUB_LICENCE_FILE
              value: {{ .licence.filePath | quote }}
            {{- if .secrets.collector.secretName }}
            - name: HUB_COLLECTOR_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ .secrets.collector.secretName }}
                  key: {{ .secrets.collector.secretKey }}
            {{- end }}
            {{- if .secrets.cataloger.secretName }}
            - name: HUB_CATALOGER_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ .secrets.cataloger.secretName }}
                  key: {{ .secrets.cataloger.secretKey }}
            {{- end }}
            {{- if .secrets.policy.secretName }}
            - name: HUB_POLICY_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ .secrets.policy.secretName }}
                  key: {{ .secrets.policy.secretKey }}
            {{- end }}
            - name: HUB_LOG_LEVEL
              value: {{ $.Values.logging.level | quote }}
            - name: HUB_LOG_FORMAT
              value: {{ $.Values.logging.format | quote }}
            - name: HUB_LOGS_AWS_BUCKET
              value: {{ .s3.logsBucket | quote }}
            - name: HUB_RESOURCES_AWS_BUCKET
              value: {{ .s3.resourcesBucket | quote }}
            - name: HUB_LOGS_AWS_URL_TTL
              value: {{ .s3.logsUrlTtl | quote }}
            - name: HUB_RESOURCES_AWS_URL_TTL
              value: {{ .s3.resourcesUrlTtl | quote }}
            {{- if .publicBaseURL }}
            - name: HUB_PUBLIC_BASE_URL
              value: {{ .publicBaseURL | quote }}
            {{- end }}
            {{- with (or .grafanaURLBase .publicBaseURL) }}
            - name: HUB_GRAFANA_URL_BASE
              value: {{ . | quote }}
            {{- end }}
            - name: HUB_K8S_EXECUTION_ENABLED
              value: "true"
            - name: HUB_MAX_WORKERS_COLLECT
              value: {{ .maxWorkers.collect | quote }}
            - name: HUB_MAX_WORKERS_POLICY
              value: {{ .maxWorkers.policy | quote }}
            - name: HUB_MAX_WORKERS_CRON_COLLECT
              value: {{ .maxWorkers.cronCollect | quote }}
            - name: HUB_MAX_WORKERS_CATALOGER
              value: {{ .maxWorkers.cataloger | quote }}
            {{- with .extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.hub.livenessProbe.enabled }}
          {{- with .Values.hub.livenessProbe }}
          livenessProbe:
            httpGet:
              path: /health
              port: hub-health
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- if .Values.hub.readinessProbe.enabled }}
          {{- with .Values.hub.readinessProbe }}
          readinessProbe:
            httpGet:
              path: /health
              port: hub-health
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          ports:
            - name: hub-grpc
              containerPort: 8000
              protocol: TCP
            - name: hub-http
              containerPort: 8001
              protocol: TCP
            - name: hub-health
              containerPort: 8002
              protocol: TCP
          {{- with .Values.hub.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.hub.persistence.enabled }}
            - name: hub-data
              mountPath: /var/lib/lunar
            {{- end }}
            - name: hub-licence
              mountPath: {{ .Values.hub.licence.filePath | quote }}
              subPath: {{ base .Values.hub.licence.filePath | quote }}
              readOnly: true
            {{- if gt (len .Values.hub.github.apps) 0 }}
            - name: github-apps
              mountPath: /secrets/github-apps
              readOnly: true
            {{- end }}
            {{- with .Values.hub.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
        {{- if .Values.hub.persistence.enabled }}
        - name: hub-data
          persistentVolumeClaim:
            claimName: {{ include "lunar.fullname" . }}-hub-data
        {{- end }}
        - name: hub-licence
          secret:
            secretName: {{ .Values.hub.licence.secretName }}
            items:
              - key: {{ .Values.hub.licence.secretKey }}
                path: {{ base .Values.hub.licence.filePath | quote }}
        {{- if gt (len .Values.hub.github.apps) 0 }}
        - name: github-apps
          secret:
            secretName: {{ .Values.hub.github.appsSecret.secretName }}
        {{- end }}
        {{- with .Values.hub.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
